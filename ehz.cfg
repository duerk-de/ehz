### main
[main]
## process hup signal after this time not receiving it
hupdelay = 5
## switch off parts
generator = true
battery = true
partlen = 224

### communication channels
[ehz]
device = /dev/serial/by-path/platform-3f980000.usb-usb-0:1.5.1:1.0-port0
baud = 9600
set_latency = false
low_latency = true
timeout = 2500000

[meters]
device = /dev/serial/by-path/platform-3f980000.usb-usb-0:1.5.3:1.0-port0
baud = 19200
set_latency = true
low_latency = true
timeout = 400000
delay = 50000
error_delay = 250000
timing_print_interval = 43200
# timing_print_interval = 10800
 
### devices
[solar]
## this device is harvesting energy
address = 3
forward_offset = 1471100000
reverse_offset = 0

[generator]
## this device is feeding energy against efr
address = 2
forward_offset = 0
reverse_offset = 0

[battery]
## this device controls the generator
device = /dev/serial/by-path/platform-3f980000.usb-usb-0:1.5.2:1.0-port0
baud = 115200
set_latency = false
low_latency = true
timeout = 50000
delay = 0
error_delay = 50000
timing_print_interval = 0
address = 1
cap_with_solar_max = false
generator_max_ampere = 10
charge_power_max = 2500
# -4 0.05C
#  0 0.1C
#  -8  125
#  -4  250
#   0  500
#   4 1000
#   8 2000
#  10 2500
# -10   50
#   0  500
#  10 5000
nominal_capacity = 5120
discharge_power_max = 2500
zero_during_crossing = true
attenuation = 1.0
timelag = 0
statlen = 90
statignore = 0.25
statmult = 5.0

# charge_force: USR2
charge_power = 750
full_rate = 25
# full_rate = 500
full_rate_integral = 100
full_power_init = 75
full_power_min = 4
full_power = 120
full_volt = 3.525
full_volt_difference = 0.050
full_volt_idle = 3.45

# firmware analysis:
# volt diff >30mV on, <20mV off
# volt >3.5V
balance_enabled = true
balance_volt_difference = 0.050
# balance_volt_high = 3.575
balance_volt_high = 3.5625
balance_volt_low = 3.475
balance_power_charge = 120
balance_power_discharge = 120
## balancing:
## 90 sec after charging start
## 3.525...3.575 V
## >= 120 W
balance_force = false
# balance_power_import_max = 150
balance_power_import_max = 600
balance_num_import_max = 3
balance_with_backup = false
# to charge battery set charge_force (USR2)
# to not switch off charging also set balance_force

# discharge_force: USR1
discharge_power = 0
discharge_power_min = 200
empty_power = 25
empty_volt = 3.10
empty_rate = 150
fstatlen = 5
low_night_volt = 3.22
low_night_rate = 35
low_solar_volt = 3.22
low_solar_rate = 35

center_volt = 3.31

[efr]
## this device connects to the outer world
forward_offset = 0
reverse_offset = 0
## only needed if current power cannot be accessed directly
minavg = 2
grace  = 2

[statistics]
quant  = 10 min
avg    = 30 min  
stat   =  5 days
calc   =  2 days
logoff =  3 hours - 1 day

### output / logging
[out]
statefile = /dibom/var/ehz/state.log

## log file
log1dtime = 60
log1file = /dibom/var/ehz/ehz.log

## another log file (usually used to log much more detailed)
log2dtime = 15
log2file = 
# log2file = /dibom/var/ehz/ehz.lg2

## log of current data (not averaged, each second)
outfile = /run/ehz.out

## current data from each sensor + all meters (content is overwritten each time)
rawfile = /run/ehz.raw

## raw data to be accessed via udp
udpnum = 3
udpaddr1 = 192.168.3.57
udpport1 = 55501
udpaddr2 = 192.168.3.57
udpport2 = 55502
udpaddr3 = 192.168.3.33
udpport3 = 55501

[error]
exec = ./err.sh "communication failure"


